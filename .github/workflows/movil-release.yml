name: movil-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: movil-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must match X.Y.Z" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/virgo-release.jks"
      - name: Build release APK and AAB
        working-directory: VirGo-Movil
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/virgo-release.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          VIRGO_API_BASE_URL: ${{ vars.VIRGO_API_BASE_URL }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Verify APK signature
        run: |
          APK=$(ls VirGo-Movil/app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Verify AAB signature
        run: |
          AAB=$(ls VirGo-Movil/app/build/outputs/bundle/release/*.aab | head -n 1)
          keytool -printcert -jarfile "$AAB"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          APK=$(ls VirGo-Movil/app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls VirGo-Movil/app/build/outputs/bundle/release/*.aab | head -n 1)
          gh release create "v$RELEASE_VERSION" "$APK" "$AAB" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$RELEASE_VERSION" \
            --generate-notes
