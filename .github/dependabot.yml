version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directory: "/VirGo-API"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/VirGo-Movil"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
